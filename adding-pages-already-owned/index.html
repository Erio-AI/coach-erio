<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" type="image/png" href="/favicon.png">
<meta name="robots" content="noindex, nofollow">
<title>You Already Own This | Erio</title>
<style>
  :root {
    --teal-900: #003a52;
    --teal-700: #005475;
    --green-500:#22c55e;
    --green-600:#16a34a;
    --green-50: #f0fdf4;
    --ink:      #17252a;
    --muted:    #536770;
    --bg:       #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding: 32px 20px 32px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  .card-owned {
    background: #ffffff;
    color: var(--ink);
    border: 2px solid var(--green-500);
    border-radius: 20px;
    padding: 44px 32px 40px;
    text-align: center;
    box-shadow: 0 12px 28px rgba(34, 197, 94, 0.12);
  }
  .owned-check-wrap {
    width: 76px;
    height: 76px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--green-50);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(34, 197, 94, 0.25);
  }
  .owned-check-wrap svg {
    width: 40px;
    height: 40px;
    color: var(--green-600);
    stroke-width: 3;
  }
  .card-owned h2 {
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--teal-900);
    margin: 0 0 8px;
    line-height: 1.25;
  }
  .card-owned p {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
  }

  @media (max-width: 620px) {
    body { padding: 20px 14px 40px; }
    .card-owned { padding: 36px 22px 32px; }
  }
</style>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "y62q1okgoq");
</script>
</head>
<body>

<div class="wrap">
  <div class="card-owned">
    <div class="owned-check-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h2>You Already Own This</h2>
    <p>You're already on the 20+ page website — there's nothing more to upgrade here.</p>
  </div>
</div>

</body>
</html>
