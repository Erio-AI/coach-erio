<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" type="image/png" href="/favicon.png">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting…</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #17252a; }
  .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #536770; padding: 20px; }
  .debug { max-width: 640px; text-align: left; background: #f4f7f9; padding: 20px; border-radius: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; }
  .debug h2 { margin: 0 0 12px; font-size: 15px; color: #003a52; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .debug b { color: #003a52; }
</style>
</head>
<body>
<div class="wrap" id="wrap">Loading your upgrade options…</div>
<script>
  (function(){
    var qs = window.location.search || '';
    var params = new URLSearchParams(qs);
    var pagesRaw = params.get('pages') || '';
    var pages = pagesRaw.trim().toLowerCase();

    var extra = qs ? qs.substring(1) : '';

    function go(url){
      if (extra) url += (url.indexOf('?') === -1 ? '?' : '&') + extra;
      window.location.replace(url);
    }

    var target;
    if (pages.indexOf('20') !== -1) {
      target = '/adding-pages-already-owned/';
    } else if (pages.indexOf('5') !== -1) {
      target = '/checkout-adding-pages-20pgs/';
    } else {
      target = '/checkout-adding-pages-05pgs-20pgs/';
    }

    if (params.get('debug') === '1') {
      document.getElementById('wrap').innerHTML =
        '<div class="debug">' +
          '<h2>Router debug</h2>' +
          '<div><b>Full URL:</b> ' + window.location.href + '</div>' +
          '<div style="margin-top:10px;"><b>?pages raw value:</b> "' + pagesRaw + '"</div>' +
          '<div style="margin-top:10px;"><b>Would redirect to:</b> ' + target + '</div>' +
          '<div style="margin-top:16px; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">Remove <code>&amp;debug=1</code> from the URL to redirect for real.</div>' +
        '</div>';
      return;
    }

    go(target);
  })();
</script>
</body>
</html>
