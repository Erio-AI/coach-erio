<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="shortcut icon" type="image/png" href="/favicon.png">
<meta name="robots" content="noindex, nofollow">
<title>Website Building… | Erio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #17252a;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .gears {
    position: relative;
    width: 140px;
    height: 140px;
    margin-bottom: 40px;
  }
  .gear {
    position: absolute;
    color: #005475;
  }
  .gear-large {
    top: 0;
    left: 0;
    width: 110px;
    height: 110px;
    animation: spin 6s linear infinite;
  }
  .gear-small {
    bottom: 0;
    right: 0;
    width: 70px;
    height: 70px;
    animation: spin-reverse 4s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes spin-reverse {
    from { transform: rotate(0deg); }
    to { transform: rotate(-360deg); }
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #003a52;
    line-height: 1.3;
    max-width: 560px;
    margin-bottom: 14px;
  }
  p {
    font-size: 15px;
    color: #536770;
    line-height: 1.55;
    max-width: 460px;
  }
  @media (max-width: 600px) {
    h1 { font-size: 20px; }
    p { font-size: 14px; }
    .gears { width: 120px; height: 120px; margin-bottom: 32px; }
    .gear-large { width: 95px; height: 95px; }
    .gear-small { width: 60px; height: 60px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="gears">

  </div>

</html>
